schema_version = 1

[canonical]
file = "products/releasefact/pyproject.toml"
key = "project.version"

[[claim]]
name = "runtime version"
file = "products/releasefact/src/releasefact/__init__.py"
template = "__version__ = \"{version}\""

[[claim]]
name = "product readme"
file = "products/releasefact/README.md"
template = "ReleaseFact v{version} is a dependency-free, read-only local MVP for Python"

[[claim]]
name = "product status"
file = "products/releasefact/STATUS.md"
template = "ReleaseFact v{version} is a frozen local MVP."

[[claim]]
name = "portfolio readme"
file = "README.md"
template = "  version consistency. The v{version} local MVP was frozen on 2026-09-17."

[[claim]]
name = "portfolio status"
file = "STATUS.md"
template = "ReleaseFact v{version} is the portfolio's fourth frozen local MVP."

[[claim]]
name = "next-run handoff"
file = "NEXT_RUN.md"
template = "ReleaseFact v{version} is now frozen as the fourth local MVP."

[[claim]]
name = "product index"
file = "products/README.md"
template = "- `releasefact/` — completed ReleaseFact v{version} read-only release-version"
