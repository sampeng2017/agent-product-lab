name: Portfolio CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Python ${{ matrix.python-version }}
    # Keep the release baseline explicit; see docs/CI_PLATFORM.md.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install declared build backend
        run: python -m pip install "setuptools>=77"

      - name: Test, build, and smoke-test portfolio products
        env:
          PYTHONWARNINGS: ${{ matrix.python-version == '3.10' && 'error' || 'default' }}
        run: ./scripts/validate-portfolio.sh
