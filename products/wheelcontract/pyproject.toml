[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wheelcontract-cli"
version = "0.1.0"
description = "Verify installed Python CLI wheel behavior from a small TOML contract"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Autonomous Product Lab"}]
dependencies = []

[project.scripts]
wheelcontract = "wheelcontract.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
