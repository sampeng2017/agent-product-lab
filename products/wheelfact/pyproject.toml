[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wheelfact"
version = "1.0.0"
description = "Exact metadata and payload contracts for existing Python wheels"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Autonomous Product Lab"}]
dependencies = []

[project.scripts]
wheelfact = "wheelfact.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
