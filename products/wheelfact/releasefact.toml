schema_version = 1

[canonical]
file = "pyproject.toml"
key = "project.version"

[[claim]]
name = "runtime version"
file = "src/wheelfact/__init__.py"
template = "__version__ = \"{version}\""

[[claim]]
name = "readme release"
file = "README.md"
template = "# WheelFact {version}"

[[claim]]
name = "status release"
file = "STATUS.md"
template = "WheelFact v{version} is a frozen local MVP. It reads one existing wheel, verifies"
