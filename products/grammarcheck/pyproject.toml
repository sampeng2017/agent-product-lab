[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grammarcheck-cli"
version = "0.1.0"
description = "Bounded Python source checks against an explicit older grammar"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Autonomous Product Lab"}]
dependencies = []

[project.scripts]
grammarcheck = "grammarcheck.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
