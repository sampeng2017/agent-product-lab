[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "residuecheck-cli"
version = "1.0.0"
description = "Bounded filesystem residue checks around one command"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Autonomous Product Lab"}]
dependencies = []

[project.scripts]
residuecheck = "residuecheck.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
