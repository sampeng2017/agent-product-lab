[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentscope-cli"
version = "1.0.0"
description = "Explain which repository instruction files apply to a coding-agent task"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Autonomous Product Lab"}]
dependencies = []

[project.scripts]
agentscope = "agentscope.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
