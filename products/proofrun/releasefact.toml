schema_version = 1

[canonical]
file = "pyproject.toml"
key = "project.version"

[[claim]]
name = "runtime version"
file = "src/proofrun/__init__.py"
template = "__version__ = \"{version}\""

[[claim]]
name = "readme release"
file = "README.md"
template = "> **Portfolio status:** ProofRun v{version} is the current frozen local MVP."

[[claim]]
name = "status release"
file = "STATUS.md"
template = "> Current frozen release: ProofRun v{version}."
