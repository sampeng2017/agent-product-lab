[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "releasefact"
version = "1.0.0"
description = "Check explicit release-version claims against one canonical TOML value"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Autonomous Product Lab"}]
dependencies = []

[project.scripts]
releasefact = "releasefact.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
